<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF Duels - Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
    <div class="dashboard-header">
        <h2>Welcome, <span id="user-handle"></span></h2>
        <button id="logout-btn">Logout</button>
    </div>

    <div class="stats-container">
        <div class="stat-box">
            <h3>Total Matches</h3>
            <p id="total-matches">--</p>
        </div>
        <div class="stat-box">
            <h3>Total Wins</h3>
            <p id="total-wins">--</p>
        </div>
        <div class="stat-box">
            <h3>Rating</h3>
            <p id="current-rating">--</p>
        </div>
    </div>

    <div class="matchmaking-container">
        <!-- FIX: was missing the closing `>` after the id attribute,
             breaking the entire DOM from this point downward -->
        <button id="create-room-btn">Host a Duel</button>
        <input type="text" id="room-code-input" placeholder="Room Code">
        <button id="join-room-btn">Join Duel</button>
    </div>

    <div class="history-container">
        <h3>Match History</h3>
        <ul id="history-list"></ul>
    </div>

    <!-- FIX: type="module" is required so ES module imports in dashboard.js work -->
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
