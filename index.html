<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF Duels - Login</title>
 <link rel="stylesheet" href="/style.css" />
</head>
<body>
    <div class="auth-container">
        <h1>Codeforces Duels</h1>
        
        <div class="auth-tabs">
            <button type="button" id="tab-login" class="active" >Login</button>
            <button type="button" id="tab-register" >Register</button>
        </div>

        <form id="auth-form">
            <input type="text" id="handle" placeholder="Codeforces Handle" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submit-btn">Login</button>
            <p id="error-message" style="color: red; display: none;"></p>
        </form>
    </div>

    <script type="module"src="js/auth.js"></script>
</body>
</html>
